name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: semver bump from latest v* tag
        required: true
        type: choice
        options:
          - rc
          - patch
          - minor
          - major
        default: rc
      notes:
        description: extra release notes
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ github.event.inputs.bump }}
          NOTES: ${{ github.event.inputs.notes }}
        run: |
          git fetch origin --tags --force

          last=$(git tag -l 'v[0-9]*' --sort=-version:refname | head -n1)
          ver=${last#v}
          ver=${ver:-0.1.0}
          core=${ver%%-*}
          pre=${ver#"$core"}
          n=${pre#-rc.}

          IFS=. read -r maj min pat <<< "$core"

          case $BUMP in
            major) ver="$((maj + 1)).0.0" ;;
            minor) ver="$maj.$((min + 1)).0" ;;
            patch) [[ $pre == -rc.* ]] && ver=$core || ver="$maj.$min.$((pat + 1))" ;;
            rc)
              [[ $pre == -rc.* ]] && ver="$core-rc.$((n + 1))" \
                || ver="$maj.$min.$((pat + 1))-rc.1"
              ;;
          esac

          tag=v$ver
          sha=$(git rev-parse 'nightly^{}')
          subject=$(git tag -l --format='%(contents:subject)' nightly)
          ref=${subject%% *}
          chrome=${subject#*chromium@}

          [[ $subject == *chromium@* && -n $ref && -n $chrome ]]

          run=$(gh run list --workflow Build --status success --limit 30 \
            --json databaseId,headSha |
            jq -r --arg sha "$sha" '.[] | select(.headSha == $sha) | .databaseId' |
            head -n1)
          test -n "$run"

          gh run download "$run" -n devtools-frontend.tar.zst -D "$RUNNER_TEMP"
          file=$(find "$RUNNER_TEMP" -name devtools-frontend.tar.zst -type f | head -n1)
          test -f "$file"

          major=${chrome%%.*}
          title="$tag for Chrome $major"
          notes=$(printf 'Built against Chrome %s (`chromium@%s`, DevTools `%s`).' \
            "$major" "$chrome" "$ref")

          [[ -z ${NOTES:-} ]] || notes+=$'\n\n'"${NOTES%$'\n'}"

          prev=$(git tag -l 'v[0-9]*' --sort=-version:refname | grep -vxF "$tag" | head -n1)

          [[ -z $prev ]] || {
            log=$(git log --format='- %s' "$prev".."$sha")
            [[ -z $log ]] || notes+=$'\n\n'"${log%$'\n'}"
          }

          notes+=$'\n'

          gh release view "$tag" >/dev/null 2>&1 && {
            printf 'release %s already exists\n' "$tag" >&2
            exit 1
          }

          pre=()
          [[ $tag == *-* ]] && pre=(--prerelease)
          gh release create "$tag" "$file" --draft --target "$sha" \
            --title "$title" --notes "$notes" "${pre[@]}"
